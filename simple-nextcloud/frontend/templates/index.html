{% extends "base.html" %}
{% block content %}
<h1>SimpleCloud — {{ username }} <a href="{{ url_for('logout') }}" style="font-size:14px">(log out)</a></h1>

<form method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">
  <input type="file" name="file" required>
  <button type="submit">Upload</button>
</form>

<h3>Your files</h3>
<ul>
  {% for f in files %}
    <li><a href="{{ url_for('download', filename=f) }}">{{ f }}</a></li>
  {% else %}
    <li>No files yet.</li>
  {% endfor %}
</ul>
{% endblock %}
