<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SimpleCloud</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 60px auto; color: #222; }
    h1 { font-size: 20px; }
    input { display: block; width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; cursor: pointer; }
    .flash { background: #fff3cd; padding: 8px; margin-bottom: 12px; border-radius: 4px; }
    ul { padding-left: 20px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}
        <div class="flash">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
