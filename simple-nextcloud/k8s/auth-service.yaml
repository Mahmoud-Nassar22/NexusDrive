apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-data-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: your-dockerhub-username/auth-service:latest
          ports:
            - containerPort: 5001
          env:
            - name: AUTH_DB_PATH
              value: "/data/auth.db"
          envFrom:
            - secretRef:
                name: simplecloud-secrets
          volumeMounts:
            - name: auth-storage
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
      volumes:
        - name: auth-storage
          persistentVolumeClaim:
            claimName: auth-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 5001
      targetPort: 5001
